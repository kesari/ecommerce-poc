server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_service}
    username: ${DB_USERNAME:inventory_service}
    password: ${DB_PASSWORD:inventory_service}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-handlers-package: com.poc.inventory.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true

inventory:
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
