server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_service}
    username: ${DB_USERNAME:order_service}
    password: ${DB_PASSWORD:order_service}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-handlers-package: com.poc.order.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true

order:
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:200}

basket:
  base-url: ${BASKET_BASE_URL:http://localhost:8083}
account:
  base-url: ${ACCOUNT_BASE_URL:http://localhost:8081}
shipment:
  base-url: ${SHIPMENT_BASE_URL:http://localhost:8087}

auth:
  jwt-secret: ${AUTH_JWT_SECRET:poc-dev-only-secret-key-change-me-0123456789abcdefghijklmnopqrstuv}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
