name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  impact-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s impact-study/harness/scoring -p 'test*.py'
      - run: python3 -m unittest discover -s impact-study/harness/run -p 'test*.py'
      - run: >-
          python3 impact-study/harness/scoring/score.py score
          --ground-truth impact-study/harness/records/REST-001.json
          --answer impact-study/harness/answers/runs/REST-001-pi-qwen3-coder-3.json
      - run: >-
          python3 impact-study/harness/scoring/score.py marginal
          --ground-truth impact-study/harness/records/REST-001.json
          --baseline impact-study/harness/answers/runs/REST-001-pi-qwen3-coder-1.json
          --candidate impact-study/harness/answers/runs/REST-001-pi-qwen3-coder-3.json

  java:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - basket-service
          - catalog-service
          - commerce-bff
          - inventory-service
          - order-service
          - payment-service
          - shipment-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: commerce-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f commerce-platform/compose.yaml config --quiet
