openapi: 3.0.3
info:
  title: Catalog Service
  version: "1.0"
  description: >-
    Product identity, descriptions, prices, and active status.
    Consumed by commerce-bff and basket-service. Stock is owned by
    inventory-service and is not represented here.
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Active products ordered by name; inactive products are excluded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
  /api/v1/products/{productId}:
    get:
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product detail including inactive products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: PRODUCT_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/products/batch-lookup:
    post:
      operationId: batchLookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds]
              properties:
                productIds:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Products found among the requested ids; unknown ids are omitted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
  /api/v1/products/{productId}/price:
    put:
      operationId: updatePrice
      description: >-
        Internal POC endpoint used to simulate catalog price changes;
        invalidates the product detail cache entry after a successful write.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priceMinor]
              properties:
                priceMinor: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: PRODUCT_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    ProductResponse:
      type: object
      required: [id, name, priceMinor, currency, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        priceMinor: { type: integer }
        currency: { type: string }
        active: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string }
