name: commerce-platform

x-java-env: &java-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  VALKEY_HOST: valkey
  SPRING_DATA_REDIS_TIMEOUT: "500ms"
  AUTH_JWT_SECRET: poc-estate-shared-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform_admin
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initialization:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
      TOPICS_FILE: /config/topic-definitions.yaml
    volumes:
      - ./scripts:/scripts:ro
      - ./kafka/topic-definitions.yaml:/config/topic-definitions.yaml:ro

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  account-service:
    build: ../account-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/account_service
      DB_USERNAME: account_service
      DB_PASSWORD: account_service
      AUTH_RATE_LIMIT_PER_MINUTE: "10000"
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  catalog-service:
    build: ../catalog-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog_service
      DB_USERNAME: catalog_service
      DB_PASSWORD: catalog_service
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      valkey: { condition: service_healthy }

  basket-service:
    build: ../basket-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/basket_service
      DB_USERNAME: basket_service
      DB_PASSWORD: basket_service
      CATALOG_BASE_URL: http://catalog-service:8082
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      valkey: { condition: service_healthy }

  inventory-service:
    build: ../inventory-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_service
      DB_USERNAME: inventory_service
      DB_PASSWORD: inventory_service
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  order-service:
    build: ../order-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/order_service
      DB_USERNAME: order_service
      DB_PASSWORD: order_service
      ACCOUNT_BASE_URL: http://account-service:8081
      BASKET_BASE_URL: http://basket-service:8083
      SHIPMENT_BASE_URL: http://shipment-service:8087
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  payment-service:
    build: ../payment-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_service
      DB_USERNAME: payment_service
      DB_PASSWORD: payment_service
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  shipment-service:
    build: ../shipment-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/shipment_service
      DB_USERNAME: shipment_service
      DB_PASSWORD: shipment_service
    ports: ["8087:8087"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      valkey: { condition: service_healthy }

  commerce-bff:
    build: ../commerce-bff
    environment:
      ACCOUNT_BASE_URL: http://account-service:8081
      CATALOG_BASE_URL: http://catalog-service:8082
      BASKET_BASE_URL: http://basket-service:8083
      ORDER_BASE_URL: http://order-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VALKEY_HOST: valkey
      SPRING_DATA_REDIS_TIMEOUT: "500ms"
      AUTH_JWT_SECRET: poc-estate-shared-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789
    ports: ["8080:8080"]
    depends_on:
      - account-service
      - catalog-service
      - basket-service
      - order-service

volumes:
  postgres-data:
  kafka-data:
  valkey-data:
  prometheus-data:
